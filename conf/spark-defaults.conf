# Spark 3.5 + Iceberg 1.10 settings shared by every job in this repo.
#
# The Python jobs set the same keys in code (src/spark_session.py,
# bench/e1_planning.py, bench/e2_cow_mor.py) so they run without SPARK_CONF_DIR.
# This file is the reference copy, for spark-sql / spark-shell sessions:
#
#   SPARK_CONF_DIR=$PWD/conf .venv/bin/spark-sql
#
# Java 17 is required (SPEC section 6.1).

spark.master                        local[4]
spark.driver.memory                 4g
spark.driver.bindAddress            127.0.0.1
spark.driver.host                   127.0.0.1
spark.ui.showConsoleProgress        false

# Pin the exact runtime. A Scala-version mismatch here fails with an obscure
# NoSuchMethodError (SPEC section 13).
spark.jars.packages                 org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# lh = HadoopCatalog on HDFS. Used by E1, E2 and (with E3_CATALOG=hadoop) E3.
# It needs no metastore process, which is why it is the default on this Mac.
spark.sql.catalog.lh                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lh.type           hadoop
spark.sql.catalog.lh.warehouse      hdfs://localhost:9000/warehouse

# spark_catalog = HiveCatalog over the Thrift metastore (scripts/start_metastore.sh).
spark.sql.catalog.spark_catalog              org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type         hive
spark.sql.catalog.spark_catalog.uri          thrift://localhost:9083
spark.sql.catalog.spark_catalog.warehouse    hdfs://localhost:9000/warehouse

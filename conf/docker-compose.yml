# Kafka (KRaft) and ClickHouse for the streaming lakehouse.
#
#   docker compose -f conf/docker-compose.yml up -d kafka        # E3 / Phase 4
#   docker compose -f conf/docker-compose.yml up -d clickhouse   # Phase 5
#
# Do not run ClickHouse during E1/E2: it competes for RAM with the Spark driver
# and the benchmark numbers stop meaning anything (SPEC section 6.3).
#
# The scripts/start_*.sh launchers do the same thing with plain `docker run`
# and are what bench/e3_chaos.sh expects (container name `kafka`).

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    # The image defaults to a single combined broker+controller KRaft node
    # advertising PLAINTEXT://localhost:9092.
    mem_limit: 1536m

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9001:9000"
    # Recent images refuse network logins for the passwordless default user
    # without this; the ports above are bound to localhost only.
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # HDFS runs on the host. The NameNode advertises the DataNode as 127.0.0.1,
    # so hdfs.xml makes the client dial the DataNode's hostname, mapped to the
    # host here. Set DATANODE_HOST to the "Hostname:" line of
    # `hdfs dfsadmin -report` (scripts/start_clickhouse.sh detects it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${DATANODE_HOST:-mac}:host-gateway"
    volumes:
      - ./clickhouse/hdfs.xml:/etc/clickhouse-server/config.d/hdfs.xml:ro
    mem_limit: 2g
